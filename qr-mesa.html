<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR de mesa — Buffet</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    @page { size: A6 portrait; margin: 6mm; }
    *{box-sizing:border-box;}
    body{
      margin:0; background:#e9e9e9; font-family:'Segoe UI', system-ui, sans-serif;
      color:#000; display:flex; justify-content:center; padding:16px 0;
    }
    .cartel{background:#fff; width:100%; max-width:340px; padding:22px; text-align:center; border-radius:8px;}
    .cartel h1{font-size:1.4rem; margin:0 0 4px;}
    .cartel .mesa{font-size:2rem; font-weight:700; margin:6px 0 14px;}
    .cartel canvas{max-width:100%; height:auto;}
    .cartel p{color:#333; font-size:.85rem; margin:14px 0 0;}
    .acciones{max-width:340px; margin:14px auto 0; text-align:center;}
    button{font-size:1rem; padding:10px 18px; cursor:pointer;}
    @media print{
      body{background:#fff; padding:0;}
      .acciones{display:none;}
    }
  </style>
</head>
<body>
  <div id="contenido"><p style="text-align:center;">Generando QR...</p></div>

  <script type="module">
    const params = new URLSearchParams(window.location.search);
    const mesaId = params.get("mesaId");
    const numero = params.get("numero");
    const cont = document.getElementById("contenido");

    if (!mesaId || !numero) {
      cont.innerHTML = `<p>Faltan datos de la mesa.</p>`;
      throw new Error("faltan parámetros");
    }

    const url = `${window.location.origin}/carta.html?mesa=${mesaId}`;

    cont.innerHTML = `
      <div class="cartel">
        <h1>🥩 Buffet del club</h1>
        <div class="mesa">Mesa ${numero}</div>
        <canvas id="qr"></canvas>
        <p>Escaneá el código para ver la carta<br>y pedir directo desde tu celular.</p>
      </div>
      <div class="acciones">
        <button id="btn-imprimir">🖨️ Imprimir</button>
      </div>
    `;
    document.getElementById("btn-imprimir").addEventListener("click", () => window.print());

    QRCode.toCanvas(document.getElementById("qr"), url, { width: 260, margin: 1 }, (err) => {
      if (err) cont.innerHTML = `<p>No se pudo generar el QR.</p>`;
    });
  </script>
</body>
</html>
