<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cocina — Buffet</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#B54A26" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .comanda{background:var(--paper); border:2px solid var(--line); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:10px;}
    .comanda-head{display:flex; justify-content:space-between; align-items:flex-start;}
    .comanda-head .numero{font-family:'IBM Plex Mono',monospace; font-size:2.4rem; font-weight:700; line-height:1; color:var(--ink);}
    .comanda-head .hora{font-family:'IBM Plex Mono',monospace; font-size:.8rem; color:var(--ink-soft); padding-top:4px;}
    .comanda-sub{display:flex; flex-wrap:wrap; gap:6px 10px; font-weight:600; font-size:1.05rem;}
    .comanda-sub .cliente{color:var(--ink-soft); font-weight:500;}
    .comanda ul{margin:0; padding:0; list-style:none; font-size:.95rem;}
    .comanda ul li{margin-bottom:5px;}
    .item-check{display:flex; align-items:center; gap:8px; cursor:pointer;}
    .item-check input{width:18px; height:18px; flex:none;}
    .item-check .tachado{text-decoration:line-through; color:var(--ink-soft);}
    #btn-sonido{white-space:nowrap;}

    /* Pedido listo: titila para que no se pase por alto en la cocina */
    .comanda.listo{border-color:var(--ember); animation:pedido-listo-parpadeo 1.1s ease-in-out infinite;}
    .comanda.listo .numero{color:var(--ember);}
    @keyframes pedido-listo-parpadeo{
      0%, 100% { box-shadow:0 0 0 0 rgba(var(--ember-rgb), .55); }
      50% { box-shadow:0 0 0 12px rgba(var(--ember-rgb), 0); }
    }
    @media (prefers-reduced-motion: reduce){
      .comanda.listo{animation:none;}
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="topbar-mount"></div>
    <main>
      <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
          <div>
            <h2>Pantalla de cocina</h2>
            <p class="lede">Se actualiza sola apenas entra un pedido nuevo. Tildá los ítems a medida que los preparás.</p>
          </div>
          <button class="btn" id="btn-sonido">🔇 Activar sonido</button>
        </div>
        <div class="grid grid-2" id="comandas">
          <p class="empty-state">Cargando pedidos...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { supabase } from "./js/supabaseClient.js";
    import { requireAuth } from "./js/auth.js";

    const user = await requireAuth(["admin", "cajera", "mesera"]);
    if (!user) throw new Error("sin sesión");

    const SIGUIENTE_ESTADO = { en_preparacion: "listo", listo: "entregado" };
    const ETIQUETA_BOTON = { en_preparacion: "Marcar listo", listo: "Marcar entregado" };
    const ETIQUETA_CANAL = { mostrador: "Mostrador", mesa: "Mesa", telefono: "Teléfono", whatsapp: "WhatsApp", rappi: "Rappi" };

    async function cargarComandas() {
      const { data: pedidos, error } = await supabase
        .from("pedidos")
        .select("id, numero, canal, mesa_id, cliente_nombre, estado, creado_at, mesas!pedidos_mesa_id_fkey(numero), pedido_items(id, nombre_producto, cantidad, anulado, listo)")
        .in("estado", ["en_preparacion", "listo"])
        .order("creado_at", { ascending: true });

      const cont = document.getElementById("comandas");
      if (error) {
        cont.innerHTML = `<p class="empty-state">No se pudo cargar la cocina.</p>`;
        return;
      }
      if (!pedidos.length) {
        cont.innerHTML = `<p class="empty-state">No hay pedidos pendientes. 🎉</p>`;
        return;
      }
      cont.innerHTML = pedidos
        .map((p) => {
          const etiquetaCanal = p.canal === "mesa" && p.mesas ? `Mesa ${p.mesas.numero}` : ETIQUETA_CANAL[p.canal] || p.canal;
          const items = (p.pedido_items || []).filter((it) => !it.anulado);
          return `
          <div class="comanda ${p.estado === "listo" ? "listo" : ""}">
            <div class="comanda-head">
              <span class="numero">#${p.numero}</span>
              <span class="hora">${new Date(p.creado_at).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}</span>
            </div>
            <div class="comanda-sub">
              <span class="canal">${etiquetaCanal}</span>
              ${p.cliente_nombre ? `<span class="cliente">${escapeHtml(p.cliente_nombre)}</span>` : ""}
            </div>
            <span class="badge badge-${p.estado}">${p.estado.replace("_", " ")}</span>
            <ul>${items
              .map(
                (it) => `
              <li>
                <label class="item-check">
                  <input type="checkbox" data-item-listo="${it.id}" ${it.listo ? "checked" : ""} />
                  <span class="${it.listo ? "tachado" : ""}">${it.cantidad} × ${escapeHtml(it.nombre_producto)}</span>
                </label>
              </li>`
              )
              .join("")}</ul>
            ${SIGUIENTE_ESTADO[p.estado] ? `<button class="btn btn-olive" data-avanzar="${p.id}" data-hacia="${SIGUIENTE_ESTADO[p.estado]}">${ETIQUETA_BOTON[p.estado]}</button>` : ""}
          </div>`;
        })
        .join("");

      cont.querySelectorAll("[data-avanzar]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          await supabase
            .from("pedidos")
            .update({ estado: btn.getAttribute("data-hacia"), actualizado_at: new Date().toISOString() })
            .eq("id", btn.getAttribute("data-avanzar"));
          cargarComandas();
        });
      });

      cont.querySelectorAll("[data-item-listo]").forEach((chk) => {
        chk.addEventListener("change", async () => {
          chk.disabled = true;
          await supabase
            .from("pedido_items")
            .update({ listo: chk.checked })
            .eq("id", chk.getAttribute("data-item-listo"));
          cargarComandas();
        });
      });
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    // ---- Alerta sonora para pedidos nuevos ----
    // Los navegadores no dejan reproducir sonido sin que la persona haya
    // tocado algo antes en la página, por eso hace falta este botón.
    let sonidoActivado = localStorage.getItem("cocina-sonido") === "1";
    let audioCtx = null;

    function actualizarBotonSonido() {
      const btn = document.getElementById("btn-sonido");
      btn.textContent = sonidoActivado ? "🔊 Sonido activado" : "🔇 Activar sonido";
      btn.classList.toggle("btn-olive", sonidoActivado);
    }

    function pitido(frecuencia, inicio) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = frecuencia;
      gain.gain.setValueAtTime(0.0001, inicio);
      gain.gain.exponentialRampToValueAtTime(0.4, inicio + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, inicio + 0.45);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(inicio);
      osc.stop(inicio + 0.45);
    }

    function sonarAlerta() {
      if (!sonidoActivado) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        pitido(880, audioCtx.currentTime);
        pitido(1175, audioCtx.currentTime + 0.28);
      } catch (e) {
        // si el navegador bloquea el audio, no rompemos la pantalla por eso
      }
    }

    document.getElementById("btn-sonido").addEventListener("click", () => {
      sonidoActivado = !sonidoActivado;
      localStorage.setItem("cocina-sonido", sonidoActivado ? "1" : "0");
      actualizarBotonSonido();
      if (sonidoActivado) sonarAlerta();
    });
    actualizarBotonSonido();

    await cargarComandas();

    // Tiempo real: un pedido nuevo suena una alerta; cualquier otro cambio
    // (avanzar estado, tildar ítems) solo refresca la pantalla en silencio.
    supabase
      .channel("cocina-pedidos")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "pedidos" }, () => {
        sonarAlerta();
        cargarComandas();
      })
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "pedidos" }, cargarComandas)
      .on("postgres_changes", { event: "*", schema: "public", table: "pedido_items" }, cargarComandas)
      .subscribe();

    // Respaldo por si el realtime no llega a conectar (wifi débil, etc.)
    setInterval(cargarComandas, 20000);
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
  </script>
</body>
</html>
